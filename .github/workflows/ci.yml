name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kursi
          POSTGRES_USER: kursi
          POSTGRES_PASSWORD: kursi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kursi -d kursi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/kursi
          DB_USERNAME: kursi
          DB_PASSWORD: kursi
        run: ./gradlew test
