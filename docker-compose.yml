services:
  postgres:
    image: postgres:16-alpine
    container_name: kursi-postgres
    environment:
      POSTGRES_DB: kursi
      POSTGRES_USER: kursi
      POSTGRES_PASSWORD: kursi
    ports:
      - "5432:5432"
    volumes:
      - kursi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kursi -d kursi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kursi-postgres-data: